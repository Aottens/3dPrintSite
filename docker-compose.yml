version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: novaprint-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: novaprint
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: novaprint-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novaprint-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/novaprint
      DATABASE_URL_SYNC: postgresql://postgres:postgres@db:5432/novaprint
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production-32chars
      DEBUG: "true"
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000"]'
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade head &&
        python -m app.db.seed &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: novaprint-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

  # E2E tests container (run on demand)
  e2e:
    build:
      context: ./e2e
      dockerfile: Dockerfile
    container_name: novaprint-e2e
    environment:
      BASE_URL: http://frontend:3000
      API_URL: http://backend:8000
    volumes:
      - ./e2e:/app
      - /app/node_modules
    depends_on:
      - frontend
      - backend
    profiles:
      - test
    command: npx playwright test

volumes:
  postgres_data:
  uploads_data:
